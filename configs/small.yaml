project:
  name: GPT From Scratch
  run_name: small
  output_dir: checkpoints/small
data:
  dataset: tinystories
  data_dir: data/small
  tokenizer_path: artifacts/tokenizer/small/tokenizer.json
  train_bin: data/small/train.bin
  val_bin: data/small/val.bin
  max_train_examples: 50000
  max_val_examples: 2000
tokenizer:
  vocab_size: 8192
  min_frequency: 2
model:
  vocab_size: 8192
  block_size: 256
  n_layer: 6
  n_head: 6
  n_embd: 384
  dropout: 0.1
  bias: true
  tie_weights: true
training:
  batch_size: 16
  gradient_accumulation_steps: 4
  max_steps: 20000
  eval_interval: 500
  eval_iters: 100
  learning_rate: 0.0006
  min_lr: 0.00006
  warmup_steps: 500
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  seed: 1337
  mixed_precision: true
  compile_model: false
logging:
  use_wandb: false
  wandb_project: gpt-from-scratch
  log_interval: 25
generation:
  prompt: "Once upon a time"
  max_new_tokens: 120
  temperature: 0.8
  top_k: 50
  top_p: 0.95
